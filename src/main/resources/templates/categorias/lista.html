<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="topo">
        <h1>Categorias</h1>
        <a class="btn" th:href="@{/categorias/novo}">+ Nova Categoria</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Ações</th></tr></thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.descricao}"></td>
            <td>
                <a class="btn peq" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                <form class="inline" th:action="@{/categorias/{id}/excluir(id=${c.id})}" method="post"
                      onsubmit="return confirm('Excluir esta categoria?')">
                    <button class="btn peq perigo" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="4" class="vazio">Nenhuma categoria cadastrada.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
