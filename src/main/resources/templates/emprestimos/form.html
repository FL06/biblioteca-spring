<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Novo Empréstimo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <h1>Novo Empréstimo</h1>
    <div class="card">
        <form th:action="@{/emprestimos/salvar}" method="post">
            <label>Leitor</label>
            <select name="leitorId" required>
                <option value="">Selecione</option>
                <option th:each="l : ${leitores}" th:value="${l.id}" th:text="${l.nome}"></option>
            </select>
            <label>Devolução prevista</label>
            <input type="date" name="dataPrevista" th:value="${sugestaoDevolucao}" required>
            <label>Livros (apenas com estoque)</label>
            <div class="checks">
                <label th:each="l : ${livros}">
                    <input type="checkbox" name="livrosIds" th:value="${l.id}">
                    <span th:text="${l.titulo} + ' (' + ${l.quantidadeDisponivel} + ' disp.)'"></span>
                </label>
                <span th:if="${#lists.isEmpty(livros)}">Nenhum livro disponível.</span>
            </div>
            <div class="acoes">
                <button class="btn ok" type="submit">Registrar</button>
                <a class="btn sec" th:href="@{/emprestimos}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
