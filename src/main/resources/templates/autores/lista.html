<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Autores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="topo">
        <h1>Autores</h1>
        <a class="btn" th:href="@{/autores/novo}">+ Novo Autor</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Nome</th><th>Nacionalidade</th><th>Nascimento</th><th>Ações</th></tr></thead>
        <tbody>
        <tr th:each="a : ${autores}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.nome}"></td>
            <td th:text="${a.nacionalidade}"></td>
            <td th:text="${#temporals.format(a.dataNascimento, 'dd/MM/yyyy')}"></td>
            <td>
                <a class="btn peq" th:href="@{/autores/{id}/editar(id=${a.id})}">Editar</a>
                <form class="inline" th:action="@{/autores/{id}/excluir(id=${a.id})}" method="post"
                      onsubmit="return confirm('Excluir este autor?')">
                    <button class="btn peq perigo" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(autores)}"><td colspan="5" class="vazio">Nenhum autor cadastrado.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
