<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leitores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>
    <div class="topo">
        <h1>Leitores</h1>
        <a class="btn" th:href="@{/leitores/novo}">+ Novo Leitor</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>CPF</th><th>Ações</th></tr></thead>
        <tbody>
        <tr th:each="l : ${leitores}">
            <td th:text="${l.id}"></td>
            <td th:text="${l.nome}"></td>
            <td th:text="${l.email}"></td>
            <td th:text="${l.telefone}"></td>
            <td th:text="${l.cpf}"></td>
            <td>
                <a class="btn peq" th:href="@{/leitores/{id}/editar(id=${l.id})}">Editar</a>
                <form class="inline" th:action="@{/leitores/{id}/excluir(id=${l.id})}" method="post"
                      onsubmit="return confirm('Excluir este leitor?')">
                    <button class="btn peq perigo" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(leitores)}"><td colspan="6" class="vazio">Nenhum leitor cadastrado.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
